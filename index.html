<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Civilization Sipoo</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101010}body{touch-action:none;font-family:Arial,sans-serif}canvas{display:block;width:100%;height:100%;image-rendering:auto;touch-action:none}
#topbar{position:fixed;z-index:4;left:0;right:0;top:0;height:58px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#17130d,#080705);border-bottom:2px solid #b18a45;box-shadow:0 2px 12px #000b;pointer-events:none}
#brand{font-family:Georgia,serif;font-size:25px;letter-spacing:4px;color:#e7d09a;text-shadow:0 2px 2px #000;font-weight:bold}
#year{position:absolute;right:16px;top:12px;background:#17130d;color:#e7d09a;border:1px solid #9c783e;border-radius:5px;padding:7px 13px;font-family:Georgia,serif;font-weight:bold;font-size:16px;letter-spacing:.5px}
#info{position:fixed;z-index:3;left:8px;top:70px;background:#000c;color:#fff;padding:7px 10px;font-size:13px;pointer-events:none}
#town{display:none;position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);background:#f4ead0;color:#211b12;border:3px solid #5b4428;border-radius:6px;min-width:230px;padding:14px;box-shadow:0 8px 30px #0008}#town h2{margin:0 0 8px;font-size:21px}#town p{margin:5px 0 12px}#town button{padding:8px 12px;font-weight:bold}
</style></head><body><div id="topbar"><div id="brand">CIVILIZATION SIPOO</div><div id="year">4000 eKr.</div></div><div id="info">Klikkaa viereistä ruutua siirtääksesi aktiivista legioonaa.</div><div id="town"><h2 id="townName"></h2><p>Taajaman keskus</p><div id="buildings"></div><button id="closeTown">Sulje</button></div><canvas id="game"></canvas>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=true;
const town=document.getElementById('town');
document.getElementById('closeTown').addEventListener('click',()=>{town.style.display='none';});
const COLS=30,ROWS=24,TILE_W=88,TILE_H=44,ORIGIN_X=COLS*TILE_W/2,ORIGIN_Y=60,STEP=20;
const images={};
const files={pelto:'assets/pelto.png',metsa:'assets/metsa.png',vesi:'assets/vesi.png',legioona:'assets/legioona.png',kuplahalli:'assets/kuplahalli.png',lidl:'assets/lidl.png'};
let loaded=0; const assetCount=Object.keys(files).length;
for(const [k,s] of Object.entries(files)){const im=new Image();im.onload=()=>{if(++loaded===assetCount)start()};im.onerror=()=>document.getElementById('info').textContent='Assetin lataus epäonnistui: '+k;im.src=s;images[k]=im}
const MAP=Array.from({length:ROWS},(_,y)=>Array.from({length:COLS},(_,x)=>{
  const edge=(x<2||y<2||x>COLS-3||y>ROWS-3); if(edge && (x<7||y<5||x>25)) return 2;
  if((x+y*3)%13===0 || (x*7+y*2)%19===0) return 1; return 0;
}));
// Water features / coastlines, leaving both town centers on land.
for(let y=0;y<ROWS;y++){MAP[y][0]=2;MAP[y][1]=2;MAP[y][COLS-1]=2;}
for(let x=0;x<COLS;x++){MAP[0][x]=2;MAP[ROWS-1][x]=2;}
const towns=[{name:'Nikkilä',x:21,y:9,buildings:[{name:'Kuplahalli',mark:'K',x:22,y:9}]},{name:'Söderkulla',x:9,y:16,buildings:[{name:'Lidl',mark:'L',x:10,y:16}]}];
for(const t of towns){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x=t.x+dx,y=t.y+dy;if(x>0&&x<COLS-1&&y>0&&y<ROWS-1)MAP[y][x]=0;}}
const units=[{x:17,y:10},{x:12,y:14}]; let active=0,year=4000,busy=false;
let camX=0,camY=0,drag=false,sx=0,sy=0,cx=0,cy=0;
function resize(){const d=devicePixelRatio||1;canvas.width=Math.floor(innerWidth*d);canvas.height=Math.floor(innerHeight*d);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0);draw()}
addEventListener('resize',resize);
function iso(x,y){return{x:ORIGIN_X+(x-y)*TILE_W/2,y:ORIGIN_Y+(x+y)*TILE_H/2}}
function fromIso(px,py){const a=(px+camX-ORIGIN_X)/(TILE_W/2),b=(py+camY-ORIGIN_Y)/(TILE_H/2);return{x:Math.round((a+b)/2),y:Math.round((b-a)/2)}}
function inside(x,y){return x>=0&&x<COLS&&y>=0&&y<ROWS}
function centerOn(u){const p=iso(u.x,u.y);camX=p.x-innerWidth/2;camY=p.y-innerHeight/2}
function start(){resize();centerOn(units[active]);update();draw()}
function update(){document.getElementById('year').textContent=year+' eKr.'}
function diamond(p,stroke,w){ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(p.x,p.y-TILE_H/2+2);ctx.lineTo(p.x+TILE_W/2-2,p.y);ctx.lineTo(p.x,p.y+TILE_H/2-2);ctx.lineTo(p.x-TILE_W/2+2,p.y);ctx.closePath();ctx.stroke()}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);ctx.save();ctx.translate(-camX,-camY);
 const names=['pelto','metsa','vesi'];
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const p=iso(x,y);ctx.drawImage(images[names[MAP[y][x]]],p.x-TILE_W/2,p.y-TILE_H/2,TILE_W,TILE_H);
ctx.strokeStyle='rgba(78,66,42,.20)';ctx.lineWidth=.75;
ctx.beginPath();ctx.moveTo(p.x,p.y-TILE_H/2);ctx.lineTo(p.x+TILE_W/2,p.y);ctx.lineTo(p.x,p.y+TILE_H/2);ctx.lineTo(p.x-TILE_W/2,p.y);ctx.closePath();ctx.stroke()}
 // Town centers and their first buildings.
 for(const t of towns){const p=iso(t.x,t.y);ctx.fillStyle='rgba(43,105,111,.34)';ctx.beginPath();ctx.moveTo(p.x,p.y-TILE_H/2);ctx.lineTo(p.x+TILE_W/2,p.y);ctx.lineTo(p.x,p.y+TILE_H/2);ctx.lineTo(p.x-TILE_W/2,p.y);ctx.closePath();ctx.fill();diamond(p,'#d6ad55',3);ctx.fillStyle='#fff8df';ctx.strokeStyle='#382515';ctx.lineWidth=3;ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.strokeText(t.name,p.x,p.y-TILE_H/2-5);ctx.fillText(t.name,p.x,p.y-TILE_H/2-5);}
 for(const t of towns){for(const b of t.buildings){const p=iso(b.x,b.y);const key=b.mark==='K'?'kuplahalli':'lidl';const im=images[key];const maxW=68,maxH=58;const sc=Math.min(maxW/im.width,maxH/im.height);const w=im.width*sc,h=im.height*sc;const baseY=p.y+7;ctx.drawImage(im,p.x-w/2,baseY-h,w,h);ctx.fillStyle='#fff8df';ctx.strokeStyle='#382515';ctx.lineWidth=2;ctx.font='11px Arial';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.strokeText(b.name,p.x,baseY+18);ctx.fillText(b.name,p.x,baseY+18)}}
 const u=units[active];
 if(!busy){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const x=u.x+dx,y=u.y+dy;if(!inside(x,y)||MAP[y][x]===2)continue;const p=iso(x,y);ctx.globalAlpha=.22;ctx.fillStyle='#ffe36b';ctx.beginPath();ctx.moveTo(p.x,p.y-TILE_H/2);ctx.lineTo(p.x+TILE_W/2,p.y);ctx.lineTo(p.x,p.y+TILE_H/2);ctx.lineTo(p.x-TILE_W/2,p.y);ctx.closePath();ctx.fill();ctx.globalAlpha=1}}
 for(let i=0;i<units.length;i++){const a=units[i],p=iso(a.x,a.y);if(i===active){diamond(p,(Math.floor(performance.now()/450)%2?'#fff':'#ffe36b'),3)}const im=images.legioona;const sc=Math.min(34/im.width,58/im.height);const w=im.width*sc,h=im.height*sc;ctx.drawImage(im,p.x-w/2,p.y-h+8,w,h);ctx.fillStyle='#163e78';ctx.strokeStyle='#f4df9b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x,p.y-h-4);ctx.lineTo(p.x+10,p.y-h+2);ctx.lineTo(p.x+10,p.y-h+19);ctx.lineTo(p.x,p.y-h+25);ctx.lineTo(p.x-10,p.y-h+19);ctx.lineTo(p.x-10,p.y-h+2);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 11px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(i+1),p.x,p.y-h+10)}
 ctx.restore()}
function finish(){busy=true;draw();setTimeout(()=>{active++;if(active>=units.length){active=0;year-=STEP}busy=false;update();centerOn(units[active]);draw()},700)}
function moveTo(x,y){if(busy)return;const a=units[active];if(!inside(x,y)||MAP[y][x]===2)return;if(Math.abs(x-a.x)>1||Math.abs(y-a.y)>1||(x===a.x&&y===a.y))return;a.x=x;a.y=y;finish()}
let pointerStartX=0,pointerStartY=0,pointerStartCamX=0,pointerStartCamY=0,pointerMoved=false;
canvas.addEventListener('pointerdown',e=>{
  if(busy)return;
  drag=true; pointerMoved=false;
  pointerStartX=e.clientX; pointerStartY=e.clientY;
  pointerStartCamX=camX; pointerStartCamY=camY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-pointerStartX,dy=e.clientY-pointerStartY;
  if(Math.abs(dx)>6||Math.abs(dy)>6) pointerMoved=true;
  if(pointerMoved){camX=pointerStartCamX-dx;camY=pointerStartCamY-dy;draw();}
});
canvas.addEventListener('pointerup',e=>{
  if(!drag)return;
  const wasMoved=pointerMoved; drag=false;
  try{canvas.releasePointerCapture(e.pointerId)}catch(_){ }
  if(wasMoved)return;
  const t=fromIso(e.clientX,e.clientY);
  if(!inside(t.x,t.y))return;
  // Town selection always wins over unit movement.
  for(const town of towns){
    if(t.x===town.x&&t.y===town.y){
      document.getElementById('townName').textContent=town.name;
      document.getElementById('buildings').innerHTML='<p><strong>Rakennukset</strong></p>'+town.buildings.map(b=>'<p style="margin:5px 0">'+b.name+'</p>').join('');
      document.getElementById('town').style.display='block';
      return;
    }
  }
  moveTo(t.x,t.y);
});
addEventListener('keydown',e=>{if(busy)return;const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];if(m){e.preventDefault();const a=units[active];moveTo(a.x+m[0],a.y+m[1])}});
function loop(){draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
